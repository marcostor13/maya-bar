<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 96" width="352" height="96" role="img" aria-label="Maya CRM">
  <title>Maya CRM</title>
  <!--
    Lockup horizontal: isotipo + "maya" + descriptor "CRM".

    "maya" va en minúsculas de trazo redondo, el mismo lenguaje que los
    botones pill y las tarjetas de la app: cercano, no corporativo. En tinta
    oscura, para que el único rojo sea el isotipo y el ojo vaya primero ahí.
    "CRM" es un descriptor: más fino, gris y espaciado.

    Todo son paths (sin fuentes), y el isotipo se alinea con la altura de x,
    no con la caja entera, para que el conjunto se apoye en la misma línea.
  -->

  <!-- Isotipo (mismo dibujo que isotipo.svg) -->
  <g transform="translate(0 2) scale(0.92)">
    <path fill="#E11D48" fill-rule="evenodd" d="
      M30 6 H66 A24 24 0 0 1 90 30 V52 A24 24 0 0 1 66 76 H43 L23.5 88.6 Q20.6 90.6 21 87.1 L22 74.6 A24 24 0 0 1 6 52 V30 A24 24 0 0 1 30 6 Z
      M26.5 64.5Q21 64.5 21 59V35.5Q21 28.6 26.2 32.9L49.5 52.2L69.3 21.6Q75 14.6 75 23.6V59Q75 64.5 69.5 64.5Q64 64.5 64 59V38.8L53.6 56.8Q49.9 61.2 45.5 57.5L32 46.3V59Q32 64.5 26.5 64.5Z
    " />
  </g>

  <!-- maya -->
  <g transform="translate(106 8)" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 46 V32 A10 10 0 0 1 20 32 V46 M20 32 A10 10 0 0 1 40 32 V46 M0 46 V22" />
    <g transform="translate(58 0)">
      <circle cx="12" cy="34" r="12" />
      <path d="M24 22 V46" />
    </g>
    <g transform="translate(100 0)">
      <path d="M0 22 V33 A12 12 0 0 0 24 33" />
      <path d="M24 22 V54 A12 12 0 0 1 12 66 H7" />
    </g>
    <g transform="translate(142 0)">
      <circle cx="12" cy="34" r="12" />
      <path d="M24 22 V46" />
    </g>
  </g>

  <!-- CRM: descriptor ligero -->
  <g transform="translate(291 33.4) scale(1.3)" fill="none" stroke="#6B7280" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.6 3.4 A 6.4 6.4 0 1 0 9.6 12.6" />
    <g transform="translate(14 0)">
      <path d="M0 16 V0 H5.6 A4.3 4.3 0 0 1 5.6 8.6 H0 M4.6 8.6 L10 16" />
    </g>
    <g transform="translate(28.5 0)">
      <path d="M0 16 V0 L6 9 L12 0 V16" />
    </g>
  </g>
</svg>
