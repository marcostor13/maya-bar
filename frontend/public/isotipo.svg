<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Maya CRM">
  <title>Maya CRM</title>
  <!--
    Isotipo: doble check. Un solo gesto, sin letras: el visto de un mensaje
    entregado (WhatsApp es el canal del producto) y, a la vez, el trato cerrado.
    El segundo trazo sube más alto que el primero para leerse como
    crecimiento. Un solo color y un solo peso: funciona igual en rojo sobre
    blanco que en blanco sobre rojo, y se lee a 16 px.
  -->
  <g fill="none" stroke="#E11D48" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 66 L90 16" />
    <path d="M8 50 L30 72 L68 24" />
  </g>
</svg>
