<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Maya CRM">
  <title>Maya CRM</title>
  <!--
    Isotipo: el visto, como una sola pieza sólida.

    Antes era un doble check de trazo fino. El trazo se lee técnico y se
    deshace al reducirlo; las marcas deportivas —Nike, Adidas— son siluetas
    macizas de un solo color, y por eso aguantan a 16 px, bordadas o en una
    barra de estado.

    La geometría es deliberada: el brazo corto es de grosor constante y el
    largo se afila hacia la punta, que es lo que le da velocidad y lo levanta
    en diagonal en vez de dejarlo quieto. Sin curvas: el corte recto se lee
    más rotundo y no se emborrona al escalar.

    Un solo relleno y sin huecos interiores: se puede teñir entero, y como
    silueta pura sirve de icono de notificación, donde Android solo respeta
    el canal alfa.
  -->
  <path fill="#E11D48" d="M4 47 L18 33 L38 53 L88 2 L94 15 L38 80 Z" />
</svg>
