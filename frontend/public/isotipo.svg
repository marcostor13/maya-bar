<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Maya CRM">
  <title>Maya CRM</title>
  <!--
    Isotipo: una burbuja de chat con una M calada.

    - La burbuja dice de qué va la plataforma: vender conversando por WhatsApp,
      Instagram y Messenger.
    - La M es la inicial, y su segunda mitad es el visto del logo anterior: el
      mensaje entregado y el trato cerrado. Conversación que termina en venta.
    - El pico derecho queda más alto que el izquierdo: la línea sube.

    Una sola tinta con la M vaciada (evenodd): se tiñe entera, y como es pura
    silueta sirve de icono de notificación en Android, que solo lee el alfa.
    Sin trazos: todo es relleno, así no se emborrona a 16 px.
  -->
  <path fill="#E11D48" fill-rule="evenodd" d="
    M30 6 H66 A24 24 0 0 1 90 30 V52 A24 24 0 0 1 66 76 H43 L23.5 88.6 Q20.6 90.6 21 87.1 L22 74.6 A24 24 0 0 1 6 52 V30 A24 24 0 0 1 30 6 Z
    M26.5 64.5Q21 64.5 21 59V35.5Q21 28.6 26.2 32.9L49.5 52.2L69.3 21.6Q75 14.6 75 23.6V59Q75 64.5 69.5 64.5Q64 64.5 64 59V38.8L53.6 56.8Q49.9 61.2 45.5 57.5L32 46.3V59Q32 64.5 26.5 64.5Z
  " />
</svg>
