name: Android

# Compila la app Android (Capacitor, proyecto Angular `mobile`) en cada push a
# main que toque el frontend, o a mano. Con los secrets de firma genera el
# bundle firmado para Play Console (.aab) y un APK firmado; sin ellos, un APK de
# depuración para probar. Ver docs/android-app.md › "Compilación en GitHub".
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Play exige un versionCode mayor en cada subida; el 100 deja atrás los
      # que ya se usaron a mano.
      - name: versionCode
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Build web para la app y copia a android/
        run: node scripts/set-env.js && npm run build:mobile && npx cap sync android

      - name: Credenciales de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compilar (firmado)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: frontend/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease -PversionCode=$VERSION_CODE

      - name: Compilar (depuración, sin secrets de firma)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=$VERSION_CODE

      - name: Borrar credenciales
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: maya-android-${{ env.VERSION_CODE }}
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
